<html>
	<head>
		<title>Авторизація</title>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
		<form>
			<div id="maket">
				<div id="autho">
					<h4>Авторизація</h4>
				</div>
				<div id="form">
					<div>
						<label for="user"></label>
						<input type="text" placeholder="Ім'я користувача або Email" id="user">
					</div>
					
					<div>
						<label for="pass"></label>
						<input type="password" placeholder="Пароль" id="pass">
					</div>
					
					<div>
						<label>
							<input type="checkbox">
							Запам'ятати мене на цому комп'ютері
						</label>
					</div>
					
					<div>
						<button type="submit">Увійти</button>
					</div>
				</div>
			</div>
				<p>Забули пароль? <a href="action_page.html">Натисніть сюди</a>, для того щоб відновити його.</p> 
		</form>
	</body>
</html>
