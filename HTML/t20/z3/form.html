<html>
	<head>
		<title>Форма оплати</title>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
		<form action="action_page.html">
			<div id="maket">
				<div id="pay">
					<h4>Оплата</h4>
				</div>
				<div id="form">
					<div>
						<label for="name"></label>
						<input type="text" placeholder="Ваше ім'я" id="name">
						
						<label for="month"></label>
						<input type="text" placeholder="ММ" id="month">
						
						<label for="year"></label>
						<input type="text" placeholder="PP" id="year">
					</div>
					<div>
						<label for="card"></label>
						<input type="text" placeholder="4111 1111 1111 1111" id="card">
						
						<label for="cvc"></label>
						<input type="password" placeholder="CVC" id="cvc">
					</div>
					<div>
						<button type="submit"><b>Оплатити</b></button>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
