<!DOCTYPE html>
<html>
	<head>
		<title>Анімація 3</title>
		<style>
			.container{
				width: 300px;
				height: 200px;
				padding-top: 50px;
				margin: 10 auto;
				background: #000000;
			}
			.ball{
				width: 10px;
				height: 10px;
				margin: 10px auto;
				border-radius: 50%;
			}
			.ball:nth-child(1) {
				background: #ff005e;
				animation: right 1s infinite ease-in-out;
			}
			.ball:nth-child(2) {
				background: #00fe93;
				animation: left 1.1s infinite ease-in-out;
			}
			.ball:nth-child(3) {
				background: #008598;
				animation: right 1.05s infinite ease-in-out;
			}
			.ball:nth-child(4) {
				background: #ffcc00;
				animation: left 1.15s infinite ease-in-out;
			}
			.ball:nth-child(5) {
				background: #243041;
				animation: right 1.1s infinite ease-in-out;
			}
			.ball:nth-child(6) {
				background: #ff7c2a;
				animation: left 1.05s infinite ease-in-out;
			}
			.ball:nth-child(7) {
				background: #513e7f;
				animation: right 1s infinite ease-in-out;
			}
			@keyframes right{
				0%{transform: translate(-15px);}
				50%{transform: translate(15px);}
				100%{transform: translate(-15px);}
			}
			@keyframes left{
				0%{transform: translate(15px);}
				50%{transform: translate(-15px);}
				100%{transform: translate(15px);}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="ball"></div>
			<div class="ball"></div>
			<div class="ball"></div>
			<div class="ball"></div>
			<div class="ball"></div>
			<div class="ball"></div>
			<div class="ball"></div>
		</div>
	</body>
</html>
